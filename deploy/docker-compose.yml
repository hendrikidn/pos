# Anatta POS di VPS yang sudah punya situs lain: PostgreSQL + API + dashboard.
# TIDAK memakai port 80/443 dan tidak menjalankan web server sendiri. API dan dashboard hanya dibuka di 127.0.0.1 pada port
# yang jarang dipakai; web server yang sudah ada (nginx/Caddy/...) meneruskan anatta-pos.dolanyu.com ke sana dan mengurus HTTPS.
# Jalankan dari folder deploy/:  docker compose up -d --build
name: posguard

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: posguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di deploy/.env}
      POSTGRES_DB: posguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posguard -d posguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sengaja TIDAK ada `ports`: database hanya terjangkau API lewat jaringan internal Docker.

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://posguard:${POSTGRES_PASSWORD}@db:5432/posguard
      PORT: "3000"
      # Satu proxy tepercaya (web server di host): alamat pemanggil diambil dari X-Forwarded-For.
      TRUST_PROXY: "1"
      DASHBOARD_URL: https://${DOMAIN:?isi DOMAIN di deploy/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Email kode masuk (SMTP). Contoh Brevo ada di .env.example.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEMPLATE: ${WHATSAPP_TEMPLATE:-}
      WHATSAPP_LANGUAGE: ${WHATSAPP_LANGUAGE:-}
    ports:
      # Hanya localhost: tidak terjangkau dari internet; web server di host yang meneruskannya.
      - "127.0.0.1:${API_PORT:-18081}:3000"

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:3000
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-18082}:3001"

  # Konsol admin platform (membuat tenant dan token owner). UI terpisah dari dashboard owner dan dipasang di domain sendiri.
  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:3000
      DASHBOARD_URL: https://${DOMAIN}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-18083}:3003"

volumes:
  pgdata:

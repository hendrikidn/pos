; Firmware sensor kehadiran customer: ESP32-C3 SuperMini + HLK-LD2410B/C + OLED SSD1306 128x64.
; Bangun: pio run | Unggah: pio run -t upload | Log: pio device monitor
[platformio]
src_dir = app

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Dua slot aplikasi (OTA) 1,5 MB + LittleFS ~1 MB di flash 4 MB. Mengganti tabel partisi butuh unggah lewat USB sekali; OTA tidak bisa mengubahnya.
board_build.partitions = partitions.csv
; Bundel root CA untuk HTTPS (dibuat oleh tools/gen_cert_bundle.py).
board_build.embed_files = certs/x509_crt_bundle.bin
lib_deps = olikraus/U8g2@^2.36.5
build_flags =
    -Icore
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    +<../core/*.c>

; Mode kalibrasi: mencetak CSV frame radar lewat USB serial (lihat README).
[env:esp32c3-calibrate]
extends = env:esp32c3
build_flags =
    ${env:esp32c3.build_flags}
    -DCAL_CSV=1
